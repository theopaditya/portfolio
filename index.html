<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Prasad | TVA Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --tva-orange: #ff8c42;
            --bg-color: #111;
        }

        body {
            background-color: var(--bg-color);
            color: var(--tva-orange);
            font-family: 'VT323', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* CRT Screen Effects */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(255, 140, 66, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 66, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        /* Text Glow */
        .glow-text {
            text-shadow: 0 0 5px rgba(255, 140, 66, 0.8), 0 0 10px rgba(255, 140, 66, 0.5);
        }

        .border-glow {
            box-shadow: 0 0 10px rgba(255, 140, 66, 0.3) inset, 0 0 10px rgba(255, 140, 66, 0.3);
        }

        /* Image Filter for Agent Mobius Effect */
        .tva-img-filter {
            filter: grayscale(100%) sepia(100%) hue-rotate(350deg) saturate(300%) contrast(150%) brightness(80%);
            mix-blend-mode: hard-light;
        }

        /* View Navigation */
        .view-section {
            display: none;
            height: 100%;
        }
        .view-section.active {
            display: block;
        }

        /* Interactive Elements */
        .menu-item:hover, .icon-container:hover {
            background-color: rgba(255, 140, 66, 0.2);
            cursor: pointer;
            transform: scale(1.02);
            transition: all 0.2s ease-in-out;
        }

        /* Miss Minutes Float Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* QR Code Overlay Trick */
        .qr-overlay {
            background-image: url('https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.linkedin.com/in/aditya-prasad270308&color=ff8c42&bgcolor=111');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            mix-blend-mode: screen;
        }
